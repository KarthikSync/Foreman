id: summarize_unread_mail
intent: "Summarize today's unread Outlook messages."
profile: default

allowed_tools:
  - outlook.mail.list
  - outlook.mail.read
  - memory.preferences.get

forbidden_tools:
  - outlook.mail.send_approved
  - outlook.mail.prepare_send
  - teams.chat.post_approved
  - browser.click
  - browser.type

success_criteria:
  - no_destructive_action
  - all_outputs_carry_taint_tags

steps:
  - name: list_unread
    tool: outlook.mail.list
    inputs:
      limit: 25
      unread_only: true
    expect:
      ok: true
      min_messages: 1

  - name: read_first
    tool: outlook.mail.read
    inputs:
      id: msg_001
    expect:
      ok: true
